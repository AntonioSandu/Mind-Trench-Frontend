<div class="modal-backdrop fade show"></div>

<div class="modal fade show d-block" role="dialog" aria-modal="true" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">

    <div class="modal-dialog modal-dialog-centered" cdkDrag cdkDragRootElement=".modal-dialog">

        <div class="modal-content">

            <div class="modal-header" cdkDragHandle>

                <h5>Select target node</h5>
                @if(requiredNodes() === 2){
                    <h5>s</h5>
                }

                <button
                    class="btn-close"
                    (click)="close()">
                </button>

            </div>

            <div class="modal-body">

                <div class="node-picker">

                    <button
                        class="arrow"
                        (click)="previous(1)">
                        ◀
                    </button>

                    <div class="node-display">
                        {{ firstNode() }}
                    </div>

                    <button
                        class="arrow"
                        (click)="next(1)">
                        ▶
                    </button>

                </div>

                @if(requiredNodes() === 2){

                    <div class="node-picker second-picker">

                        <button
                            class="arrow"
                            (click)="previous(2)">
                            ◀
                        </button>

                        <div class="node-display">
                            {{ secondNode() }}
                        </div>

                        <button
                            class="arrow"
                            (click)="next(2)">
                            ▶
                        </button>

                    </div>

                }

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-matrix"
                    (click)="submit()">

                    Confirm

                </button>

            </div>

        </div>

    </div>

</div>
